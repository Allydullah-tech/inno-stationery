<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Checkout — INNO's STATIONERY</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#E85D2C">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css?v=7">
</head>
<body>

<div id="site-header"></div>

<main>
  <section class="section" style="padding-top:44px;">
    <div class="container">

      <div id="checkoutContent" style="display:grid;grid-template-columns:1.3fr 1fr;gap:32px;align-items:flex-start;">
        <!-- Form -->
        <div class="form-card">
          <h2 style="font-size:22px;">Checkout details</h2>
          <form id="checkoutForm">
            <div class="field-row">
              <div class="field">
                <label for="custName">Full name *</label>
                <input type="text" id="custName" required>
              </div>
              <div class="field">
                <label for="custPhone">Phone number *</label>
                <input type="tel" id="custPhone" required placeholder="07XXXXXXXX">
              </div>
            </div>
            <div class="field">
              <label for="custEmail">Email (optional)</label>
              <input type="email" id="custEmail">
            </div>

            <div class="field">
              <label>How would you like to receive your order? *</label>
              <div class="radio-cards">
                <label class="radio-card">
                  <input type="radio" name="fulfillment" value="pickup" checked>
                  <span><strong>Pickup</strong><br><small style="color:var(--ink-soft);">Collect from our shop, free</small></span>
                </label>
                <label class="radio-card">
                  <input type="radio" name="fulfillment" value="delivery">
                  <span><strong>Delivery</strong><br><small style="color:var(--ink-soft);">Prepaid, sent to your address</small></span>
                </label>
              </div>
            </div>

            <div class="field" id="addressField" style="display:none;">
              <label for="custAddress">Delivery address *</label>
              <textarea id="custAddress" placeholder="Street, area, landmark…"></textarea>
            </div>

            <div class="field">
              <label for="custNotes">Order notes (optional)</label>
              <textarea id="custNotes" placeholder="Anything we should know about your order?"></textarea>
            </div>

            <div id="checkoutAlert"></div>

            <button type="submit" class="btn btn-primary btn-block" id="placeOrderBtn">Place Order</button>
          </form>
        </div>

        <!-- Order summary -->
        <div class="form-card" style="position:sticky;top:100px;">
          <h2 style="font-size:19px;">Order summary</h2>
          <div id="summaryItems"></div>
          <div class="ticket-row"><span class="k">Subtotal</span><span class="v" id="sumSubtotal">TSh 0</span></div>
          <div class="ticket-row"><span class="k">Delivery fee</span><span class="v" id="sumDelivery">TSh 0</span></div>
          <div class="ticket-row"><span class="k" style="font-weight:700;">Total</span><span class="v ticket-total" id="sumTotal">TSh 0</span></div>
        </div>
      </div>

      <!-- Success view (shown after order placed) -->
      <div id="successView" style="display:none;max-width:520px;margin:0 auto;"></div>

    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/core.js?v=7"></script>
<script src="js/checkout.js?v=7"></script>
</body>
</html>
